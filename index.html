<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Samuel's Game</title>
    <meta name="description" content="Samuel's Game: a top-down magic action adventure. Fight through ruins, desert and palace, defeat the bosses and level up." />
    <meta name="theme-color" content="#14121c" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <style>
      @font-face { font-family: "SamuelPixel"; src: url("/assets/fonts/SamuelPixel.ttf"); }
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #game { width: 100%; height: 100%; }
      canvas { display: block; image-rendering: pixelated; touch-action: none; }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        align-items: center;
        justify-content: center;
        background: #14121c;
        color: #fff;
        font: 28px "SamuelPixel", sans-serif;
        text-align: center;
      }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Rotate your device</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
